[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-sslwireless-sms"
dynamic = ["version"]
description = "Django integration for the SSL Wireless ISMS Plus SMS API v3: single, bulk, dynamic and secure OTP messages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Anik Sharif", email = "aniksharif@gmail.com" }]
keywords = ["django", "sms", "ssl wireless", "isms plus", "otp", "bangladesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = [
    "Django>=4.2",
    "requests>=2.28",
    "cryptography>=41",
]

[project.urls]
Homepage = "https://github.com/aniksharif/django-sslwireless-sms"
Repository = "https://github.com/aniksharif/django-sslwireless-sms"
Issues = "https://github.com/aniksharif/django-sslwireless-sms/issues"
"API documentation" = "https://ismsplus.sslwireless.com/api-documentation"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "responses>=0.25",
]

[tool.hatch.version]
path = "django_sslwireless_sms/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["django_sslwireless_sms"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: sends real requests to the ISMS Plus API (run with `pytest -m integration`)",
]
